<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store">
    <meta name="theme-color" content="#101d4d">
    <title>IESA 2026 7th Grade Class 2A</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <script src="../theme.js?v=2"></script>
    <link rel="stylesheet" href="../styles.css?v=26">
    <link rel="stylesheet" href="../score-updates.css?v=6">
    <link rel="stylesheet" href="../theme.css?v=16">
    <link rel="stylesheet" href="../bracket-navigation.css?v=3">
</head>
<body class="app live">
    <header class="topbar">
        <div><div class="title"></div><div class="detail"></div></div>
        <nav class="switcher" aria-label="Tournament season and grade"><select id="season-select" aria-label="Tournament year" disabled><option>Loading years...</option></select><a class="active" href="index.html">7th</a><a href="../8th/index.html">8th</a></nav>
        <div class="tools">
            <button id="find-button" type="button" aria-label="Find a team"><img src="../search-icon.svg" alt="" aria-hidden="true"></button>
            <button id="updates-button" type="button">Score updates</button>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><img src="../theme-moon.svg" alt="" aria-hidden="true"></button>
            <button id="minus">-</button><button id="plus">+</button><button id="fit">Fit to screen</button>
        </div>
    </header>
    <main id="viewport"><section id="bracket" aria-label="Tournament bracket"><svg width="3360" height="1450"></svg></section></main>
    <dialog id="find-dialog">
        <div class="dialog-head"><strong>Find a team</strong><button id="close-find" type="button" aria-label="Close">&times;</button></div>
        <label for="team-search">Team name</label>
        <input id="team-search" type="search" autocomplete="off" placeholder="Search teams">
        <p id="find-message" role="status">Type a team name to search.</p>
        <div id="team-results" aria-label="Matching teams"></div>
    </dialog>
    <dialog id="projection-dialog">
        <div class="dialog-head"><strong id="projection-title"></strong><button id="close-projection" type="button" aria-label="Close regional bracket">&times;</button></div>
        <div id="projection-rounds"></div>
        <a id="projection-source" href="#" target="_blank" rel="noopener noreferrer" hidden>View official IESA bracket</a>
    </dialog>
    <dialog id="updates-dialog">
        <div class="dialog-head"><strong>Latest score updates</strong><button type="button" id="close-updates" aria-label="Close">&times;</button></div>
        <p id="updates-summary"></p>
        <div id="updates-window" class="updates-window" role="group" aria-label="Time window"></div>
        <table id="updates-table" aria-label="Recently changed scores"><thead><tr><th>Team</th><th>Game</th><th>Score</th><th>When</th></tr></thead><tbody></tbody></table>
    </dialog>
    <dialog id="record-dialog">
        <div class="dialog-head"><strong id="team-name"></strong><button type="button" id="close-dialog" aria-label="Close">&times;</button></div>
        <p id="team-record">Loading official IESA results…</p>
        <table id="score-history" aria-label="Official IESA results"><tbody></tbody></table>
        <div class="dialog-actions"><a id="official-scores" href="#" target="_blank" rel="noopener" hidden>IESA page</a><button id="refresh-scores" type="button" aria-label="Update this team's IESA scores"><img src="../refresh-icon.svg" alt="" aria-hidden="true">Update</button></div>
        <p class="record-note" id="record-note" role="status">Nightly scores are read from IESA. PENDING games do not affect the record.</p>
        <form id="record-form" hidden><input id="opponent"><input id="team-score"><input id="opponent-score"></form>
    </dialog>
    <script src="data.js?v=3"></script><script src="../bracket-7th.js?v=1"></script><script src="../regional-seeds-7th.js?v=1"></script><script src="../app.js?v=30"></script><script src="../season-selector.js?v=4"></script>
    <script src="../scores-7th.js?v=1"></script><script src="../score-cache.js?v=11"></script>
    <script src="../pointer-zoom.js?v=3"></script><script src="../spaced-layout.js?v=21"></script>
    <script src="../regional-record-sort.js?v=8"></script><script src="../score-updates.js?v=12"></script>
    <script src="../bracket-navigation.js?v=2"></script>
    <script src="../touch-navigation.js?v=2"></script>
</body>
</html>
