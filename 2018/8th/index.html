<body class="app">
    <header class="topbar">
        <div><div class="title"></div><div class="detail"></div></div>
        <nav class="switcher" aria-label="Tournament season and grade"><select id="season-select" aria-label="Tournament year" disabled><option>Loading years...</option></select><a href="../7th/index.html" >7th</a><a href="../8th/index.html" class="active">8th</a></nav>

    <main id="viewport"><section id="bracket" aria-label="2018 8th Grade Class 1A tournament bracket"><svg width="3360" height="1450"></svg></section></main>

        <div id="team-results" aria-label="Matching teams"></div>

    <dialog id="projection-dialog">
        <div class="dialog-head"><strong id="projection-title"></strong><button id="close-projection" type="button" aria-label="Close regional bracket">&times;</button></div>
