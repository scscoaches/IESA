name: Update IESA scores nightly

on:
  schedule:
    # 3:15 AM UTC (~10:15 PM Central) every night during the season
    - cron: "15 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run score refresh script
        shell: pwsh
        run: ./2026/Update-IesaScores.ps1 -SitePath "${{ github.workspace }}/2026"

      - name: Commit and push refreshed scores
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2026/scores-7th.json 2026/scores-7th.js 2026/scores-8th.json 2026/scores-8th.js
          if (git diff --cached --quiet) {
            Write-Host "No score changes to commit."
          } else {
            git commit -m "Nightly IESA score refresh"
            git push
          }
