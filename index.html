<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#101d4d">
    <title>IESA Girls Basketball Brackets</title>
    <link rel="icon" type="image/png" sizes="32x32" href="2026/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="2026/apple-touch-icon.png">
    <link rel="manifest" href="2026/manifest.json">
    <script src="2026/theme.js?v=2"></script>
    <script src="2026/my-team.js?v=7"></script>
    <link rel="stylesheet" href="2026/styles.css?v=63">
    <link rel="stylesheet" href="2026/theme.css?v=31">
    <style>
        .home{max-width:760px;margin:0 auto;padding:22px 16px 40px}
        .home h1{margin:0 0 16px;font-size:clamp(24px,5vw,34px);text-align:center}
        .home .lead{margin:0 0 18px;color:#5b6479;text-align:center}
        .card{margin:0 0 14px;padding:16px;border:1px solid #d6dbe7;border-radius:8px;background:#fff}
        .card h2{margin:0 0 10px;font-size:17px}
        #classes{width:fit-content;max-width:100%;margin:0 auto;box-sizing:border-box}
        .class-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 0;border-top:1px solid #edf0f5}
        .class-row:first-of-type{border-top:0}
        .class-name{min-width:84px;font-weight:bold}
        .grade-link{display:inline-block;min-width:96px;padding:9px 14px;border:1px solid #b9c1d0;border-radius:4px;background:#fff;color:#2533ba;font-weight:bold;text-align:center}
        .grade-link:hover,.grade-link:focus{background:#eef0ff}
        .mine-label{padding:3px 9px;border-radius:10px;background:#f2c14e;color:#141a2c;font-size:12px;font-weight:bold}
        .topbar .title{font-size:16px;max-width:none}
        .dark-theme .home .lead{color:#aab2cc}
        .dark-theme .card{border-color:#2c3550;background:#18213d}
        .dark-theme .class-row{border-top-color:#2c3550}
        .dark-theme .grade-link{border-color:#56607e;background:transparent;color:#cbd1ff}
        .dark-theme .grade-link:hover,.dark-theme .grade-link:focus{background:#26304d}
        @media(max-width:480px){#classes{width:auto}.class-name{min-width:100%}.grade-link{flex:1 1 0;min-width:0}}
    </style>
</head>
<body class="home-page">
    <header class="topbar">
        <a class="iesa-logo" href="https://www.iesa.org/activities/gbk/" target="_blank" rel="noopener noreferrer" title="IESA Girls Basketball"><img src="2026/iesa-logo.png" alt="IESA Girls Basketball" width="177" height="88"></a>
        <div><div class="title">IESA Girls Basketball</div><div class="detail" id="season-detail"></div></div>
        <div class="tools" style="margin-left:auto">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><img src="2026/theme-moon.svg" alt="" aria-hidden="true"></button>
        </div>
    </header>
    <main class="home">
        <h1 id="season-title">Tournament brackets</h1>
        <p class="lead" id="season-lead" hidden></p>
       <section class="card" id="classes" aria-label="Brackets by class" hidden></section>
        <noscript><p>Turn on JavaScript to see this season's brackets.</p></noscript>
    </main>
    <script>
    (function () {
        "use strict";
        function element(tag, className, text) {
            var node = document.createElement(tag);
            if (className) { node.className = className; }
            if (text !== undefined) { node.textContent = text; }
            return node;
        }
        // The first class built for a year keeps <year>/<grade>; others live in <year>/<class>/<grade>.
        function folderFor(season, className) {
            return !className || className === season.className ? String(season.year) : season.year + "/" + className;
        }
        function gradeLink(season, className, grade) {
            var link = element("a", "grade-link", grade === "combined" ? "Combined" : grade + " Grade");
            link.href = folderFor(season, className) + "/" + grade + "/index.html";
            return link;
        }
        function fail(message) { var lead = document.getElementById("season-lead"); lead.textContent = message; lead.hidden = false; }

        fetch("seasons.json", { cache: "no-store" }).then(function (response) {
            if (!response.ok) { throw new Error("The season list could not be loaded (HTTP " + response.status + ")."); }
            return response.json();
        }).then(function (seasons) {
            if (!Array.isArray(seasons) || !seasons.length) { throw new Error("No seasons are listed."); }
            // Always the newest season listed, so each new season appears here without edits.
            var season = seasons.slice().sort(function (a, b) { return b.year - a.year; })[0];
            var classes = Array.isArray(season.classes) && season.classes.length ? season.classes : [season.className || null];
            var grades = season.gradeMode === "combined" ? ["combined"] : ["7th", "8th"];
            document.title = "IESA Girls Basketball " + season.year;
            document.getElementById("season-title").textContent = season.year + " Tournament Brackets";
            document.getElementById("season-detail").textContent = season.archived ? season.year + " season (completed)" : season.year + " season";

            var list = document.getElementById("classes");
            var rows = {};
            classes.forEach(function (className) {
                var row = element("div", "class-row");
                if (className) { row.appendChild(element("span", "class-name", "Class " + className)); }
                grades.forEach(function (grade) { row.appendChild(gradeLink(season, className, grade)); });
                rows[className] = row;
                list.appendChild(row);
            });
            list.hidden = false;

            var myTeam = window.iesaMyTeam;
            if (!myTeam || !myTeam.name) { return; }
            // Mark the class (or classes) the chosen team plays in this season.
            Promise.all(grades.map(function (grade) { return myTeam.classFor(season.year, grade).catch(function () { return null; }); }))
                .then(function (found) {
                    var classNames = found.filter(function (value, i, all) { return value && all.indexOf(value) === i; });
                    classNames.forEach(function (className) {
                        if (!rows[className]) { return; }
                        rows[className].classList.add("mine");
                        rows[className].appendChild(element("span", "mine-label", "My team"));
                    });
                });
        }).catch(function (error) { fail(error.message); });
    })();
    </script>
</body>
</html>
